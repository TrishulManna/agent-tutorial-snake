<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Copper Snake</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="dist/game.js"></script>
  </head>
  <body>
    <main>
      <h1>Copper Snake</h1>
      <p id="controls">Use the arrow keys or WASD to steer. Collect the green food and avoid the walls and your tail.</p>
      <div id="board" tabindex="0" aria-label="Snake board" aria-describedby="controls"></div>
      <p id="score"></p>
      <p id="status" role="status"></p>
      <button id="restart" type="button" hidden>Play again</button>
    </main>
  </body>
</html>
